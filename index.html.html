['Red Sea and Suez',36,22,'The Red Sea lies between north-east Africa and Asia. The Suez Canal (opened 1869) links it to the Mediterranean, so ships do not sail around Africa.',[['Which canal joins the Mediterranean and the Red Sea?','Suez Canal',['Panama Canal','Corinth Canal','Kiel Canal'],'It is in Egypt.'],['Which country has a Red Sea coast?','Eritrea',['Chad','Mali','Zambia'],'Chad, Mali and Zambia are landlocked.']]],
['Southern tip',20,-37,'Cape Agulhas, at about 35° S, is Africa’s most southern point. It is where the Atlantic and Indian Oceans meet. South of it lies the Southern Ocean around Antarctica.',[['Which is Africa’s southernmost point?','Cape Agulhas',['Cape Town','Durban','Maputo'],'Not Cape Town or the Cape of Good Hope.'],['Which ocean lies south of Africa, around Antarctica?','Southern Ocean',['Arctic Ocean','Pacific Ocean','Atlantic Ocean'],'The Southern Ocean surrounds Antarctica.']]],
['Kingdom in the sky',28.2,-29.6,'Lesotho is an enclave: a country completely surrounded by another, South Africa. All of Lesotho lies above 1 000 m in the Drakensberg mountains. A border is a line showing where one country ends and another begins.',[['Which country is completely surrounded by South Africa?','Lesotho',['Eswatini','Botswana','Namibia'],'Eswatini borders South Africa and Mozambique.'],['What is a border?','A line where one country ends and another begins',['A line of latitude','A type of ocean','A capital city'],'Borders separate countries.']]],
['The smoke that thunders',25.9,-17.9,'Victoria Falls on the Zambezi River is about 108 m high. The river forms part of the border between Zambia and Zimbabwe. Locals call the falls Mosi-oa-Tunya.',[['Which river forms the Zambia–Zimbabwe border?','Zambezi River',['Nile River','Congo River','Orange River'],'Rivers are natural borders.'],['Which is a natural border?','A river or mountain range',['A line drawn with a ruler','A road sign','A time zone'],'Natural borders follow physical features.']]],
['Ruler-straight borders',25,27,'Look at the straight Egypt–Libya border. Many borders in Africa are straight lines drawn by European powers (Berlin Conference, 1884–85) without asking the people who lived there.',[['Why are many African borders straight lines?','They were drawn on maps by colonial powers',['Rivers made them straight','They follow the Equator','Farmers built them'],'Many ignored where people actually lived.'],['How many countries does Africa have today?','54',['44','64','34'],'Africa has 54 countries.']]],
['Landlocked highlands',39,8,'Ethiopia is landlocked. It lost its coast when Eritrea became independent in 1993, so most trade goes through the port of Djibouti. Addis Ababa hosts the African Union headquarters.',[['Is Ethiopia landlocked or coastal?','Landlocked',['Coastal','An island','A peninsula'],'It has no coastline.'],['Which neighbour’s port does Ethiopia mainly use?','Djibouti',['Egypt','Kenya','Libya'],'Landlocked countries depend on neighbours’ ports.']]],
['Lake Victoria',32,0.5,'Africa has 16 landlocked countries, such as Uganda, Mali, Zambia and Botswana. Uganda lies on the Equator, and Lake Victoria (Africa’s largest lake) is shared by Uganda, Kenya and Tanzania.',[['How many landlocked countries are in Africa?','16',['6','26','36'],'Examples: Uganda, Mali, Zambia, Lesotho.'],['Which lake do Uganda, Kenya and Tanzania share?','Lake Victoria',['Lake Chad','Lake Malawi','Lake Nasser'],'It is Africa’s largest lake.']]],
['Lake Chad',14,13,'Chad is landlocked. Lake Chad has shrunk a lot since the 1960s because of drought and water use. Four countries share it: Chad, Niger, Nigeria and Cameroon.',[['Which of these is landlocked?','Chad',['Nigeria','Cameroon','Ghana'],'Nigeria, Cameroon and Ghana have coasts.'],['Why can landlocked countries find trade harder?','Goods must pass through a neighbour’s ports',['They have no roads','They have no rain','They are too small'],'This adds time and cost.']]],
['On the Equator',37.3,0,'The Equator crosses Kenya (near Mount Kenya), Uganda, Somalia, Gabon, Republic of Congo and DR Congo. Kenya’s capital Nairobi is just south of it, at about 1° S.',[['Which of these is crossed by the Equator?','Gabon',['Egypt','South Africa','Angola'],'Egypt is north and Angola and South Africa are south of it.'],['Is Nairobi north or south of the Equator?','South (about 1° S)',['North','Exactly on it','East of it'],'Its latitude is about 1° S.']]],
['Top of Africa',9.5,34,'Tunisia is Africa’s northernmost country. Algeria is Africa’s largest country by area, mostly Sahara desert. Both lie north of the Equator.',[['Which is Africa’s largest country by area?','Algeria',['Nigeria','Egypt','South Africa'],'Algeria is larger than DR Congo, the second.'],['Is Tunisia north or south of the Equator?','North',['South','On the Equator','Neither'],'It is about 34–37° N.']]],
['Cape Town and the capitals',18.4,-33.9,'South Africa has 3 capitals: Pretoria (executive), Cape Town (legislative, Parliament) and Bloemfontein (judicial). Johannesburg is its biggest city. Cape Town is about 34° S and 18° E.',[['Which city is South Africa’s executive capital?','Pretoria',['Cape Town','Johannesburg','Durban'],'Cape Town has Parliament.'],['Cape Town lies in which hemispheres?','Southern and Eastern',['Northern and Eastern','Southern and Western','Northern and Western'],'34° S and 18° E.']]],
['Island giant',46.7,-19.3,'Madagascar is the world’s 4th-largest island and also a country. It lies in the Indian Ocean, separated from Mozambique by the Mozambique Channel. Lemurs live in the wild only here. Capital: Antananarivo.',[['Madagascar is…','both a country and an island',['only an island','a landlocked country','part of Mozambique'],'It has its own government.'],['Which channel separates Madagascar from Africa?','Mozambique Channel',['Suez Canal','Gulf of Guinea','Red Sea'],'It is about 400 km wide.']]],
['Spice island',39.3,-6.1,'Zanzibar is an island in the Indian Ocean, part of Tanzania. Stone Town is a UNESCO World Heritage Site, and Zanzibar was long famous for spices such as cloves.',[['Zanzibar is part of which country?','Tanzania',['Kenya','Madagascar','Mozambique'],'It is not a separate country.'],['What is Zanzibar?','An island that belongs to Tanzania',['An independent country','A lake in Kenya','A mountain'],'It lies off Tanzania’s coast.']]],
['Nile delta',31.2,30,'Cairo is Egypt’s capital on the Nile, which is about 6 650 km long and flows north to the Mediterranean. Most Egyptians live near the river.',[['In which direction does the Nile flow?','North',['South','East','West'],'It flows to the Mediterranean Sea.'],['From Cairo, in which direction is Cape Town?','South',['North','East','North-west'],'Cairo is about 30° N and Cape Town about 34° S.']]],
['Map skills',22,-10,'Lines of latitude run east–west and measure north or south of the Equator. Lines of longitude run north–south and measure east or west of the Prime Meridian. The scale bar at the bottom-left of the map shows 1 000 km.',[['Lines of latitude run…','east to west',['north to south','from the Equator to the South Pole only','in circles around Cape Town'],'Longitude runs north–south.'],['A map scale says 1 cm = 500 km. Two cities are 4 cm apart. How far apart are they?','2 000 km',['200 km','1 000 km','4 000 km'],'4 × 500 = 2 000 km.']]]];
const R=P.map(c=>({c,r:c.p.split('M').filter(Boolean).map(s=>s.replace(/Z/g,'').split('L').map(t=>t.split(' ').map(Number)))}));
const pip=(r,x,y)=>{let f=false;for(let i=0,j=r.length-1;i<r.length;j=i++){const[a,b]=r[i],[c,d]=r[j];if((b>y)!=(d>y)&&x<(c-a)*(y-b)/(d-b)+a)f=!f}return f};
const where=(x,y)=>{const lo=LON(x),la=LAT(y);for(const q of R){const b=q.c.b;if(lo<b[0]||lo>b[2]||la<b[1]||la>b[3])continue;if(q.r.some(r=>pip(r,x/K,y/K)))return q.c}return null};
const sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const $=s=>document.querySelector(s),box=$('#box'),hud=$('#hud'),tst=$('#toast');
const LLK=new Set('Mali,Niger,Chad,Burkina Faso,South Sudan,Central African Republic,Ethiopia,Uganda,Rwanda,Burundi,Zambia,Malawi,Zimbabwe,Botswana,Eswatini,Lesotho'.split(','));
const ISL=new Set('Madagascar,Comoros,Mauritius,Seychelles,Cape Verde,São Tomé & Príncipe'.split(','));
const hemi=c=>c.b[1]<0&&c.b[3]>0?'on the Equator':c.b[3]<=0?'south of the Equator':'north of the Equator';
const kind=c=>LLK.has(c.n)?'landlocked':ISL.has(c.n)?'island country':'coastal';
const fmt=(v,p,n)=>Math.abs(v).toFixed(1)+'°'+(v>=0?p:n);
let pl0=null,tgt=null,hp=6,got=S.adv.m.length,busy=true,until=0,dir={x:0,y:0},here=null,marks=[],LB=[],disc=new Set(S.adv.d),study=true,cur=null,tt=0;
function say(h){box.innerHTML=h;box.style.display='block'}
function intro(){say(`<h2 style="margin:0">🧭 ADVENTURE</h2><p><b>How to play</b><br>1️⃣ <b>Tap or click</b> the map to walk (or use arrow keys, WASD or the pad).<br>2️⃣ Follow the yellow ➤ arrow to a <b>?</b> block.<br>3️⃣ Read the field note, then answer 2 questions.</p><p>❤️ You have 6 hearts. If they run out you just respawn: your progress is saved!</p><button onclick="AD.go(1)">📘 Start: all names shown (easier)</button><button onclick="AD.go(0)">🎯 Start: Challenge (names appear as you discover them)</button>`)}
function go(s){study=!!s;box.style.display='none';busy=false}
function tg(){study=!study;toast(study?'🏷️ All names shown':'🎯 Names hidden until discovered')}
function toast(h){tst.innerHTML=h;tst.style.display='block';clearTimeout(tt);tt=setTimeout(()=>tst.style.display='none',6500)}
function jr(){if(busy&&box.style.display==='block')return;busy=true;const l=[...disc].sort();say(`<b>📔 Explorer’s Journal</b><p>Countries discovered: ${l.length}/54 · Missions: ${got}/${MS.length}</p><p>${l.map(n=>n+' – '+byN[n].c).join('<br>')||'Walk onto land to discover countries!'}</p><button onclick="AD.cont()">Close</button>`)}
const byN=Object.fromEntries(P.map(c=>[c.n,c]));
function mis(m){busy=true;cur={m,i:0,w:0};say(`<b>📍 ${m.d[0]}</b><p>📖 <b>Field note:</b> ${m.d[3]}</p><button onclick="AD.qn()">Answer the questions ▶</button>`)}
function qn(){const q=cur.m.d[4][cur.i],o=sh([q[1],...q[2]]);cur.o=o;say(`<b>${cur.m.d[0]} · Question ${cur.i+1}/${cur.m.d[4].length}</b><p style="font-weight:700">${q[0]}</p>`+o.map((t,k)=>`<button onclick="AD.an(${k},this)">${t}</button>`).join(''))}
function an(k,b){const q=cur.m.d[4][cur.i],good=cur.o[k]===q[1];box.querySelectorAll('button').forEach((x,j)=>{x.disabled=true;if(cur.o[j]===q[1])x.classList.add('ok')});if(!good){b.classList.add('no');hp--;cur.w++}
let n;if(hp<=0)n='<p>☠️ Out of hearts! You respawn with full hearts. Your progress is saved.</p><button onclick="AD.respawn()">↻ Respawn</button>';
else if(++cur.i<cur.m.d[4].length)n='<button onclick="AD.qn()">Next question ▶</button>';
else{const m=cur.m;got++;if(!S.adv.m.includes(m.i))S.adv.m.push(m.i);save();lbS();m.s.destroy();m.t.destroy();marks=marks.filter(z=>z!==m);const bonus=cur.w==0&&hp<6;if(bonus)hp++;n=`<p>🗺️ <b>Mission complete! (${got}/${MS.length})</b>${bonus?' Perfect: +1 ❤️':''}</p>`+(got==MS.length?'<p>🏆 <b>You restored the Explorer’s Map. Master Cartographer!</b></p><button onclick="toMain()">🏠 Main menu</button>':'<button onclick="AD.cont()">Continue exploring ▶</button>')}
box.insertAdjacentHTML('beforeend',`<p>${good?'✅ Correct!':'💔 Not quite.'} 📖 ${q[3]}</p>`+n)}
function cont(){box.style.display='none';busy=false;until=performance.now()+1500}
document.querySelectorAll('#pad button').forEach(b=>{const[dx,dy]=b.dataset.d.split(',').map(Number),on=e=>{e.preventDefault();dir={x:dx,y:dy}},off=e=>{e.preventDefault();dir={x:0,y:0}};['touchstart','mousedown'].forEach(v=>b.addEventListener(v,on));['touchend','touchcancel','mouseup','mouseleave'].forEach(v=>b.addEventListener(v,off))});
function create(){const g=this.add.graphics();
g.fillStyle(0x3b79c9,1).fillRect(0,0,712*K,640*K);
g.lineStyle(1,0xffffff,.18);for(let o=-20;o<=60;o+=20)g.lineBetween(X(o),0,X(o),640*K);for(let a=-40;a<=40;a+=20)g.lineBetween(0,Y(a),712*K,Y(a));
g.lineStyle(3,0xff5252,.9).lineBetween(0,Y(0),712*K,Y(0));g.lineStyle(3,0xffeb3b,.9).lineBetween(X(0),0,X(0),640*K);
const lab=(x,y,t,sz,col,k,it)=>{const o=this.add.text(x,y,t,{fontFamily:'Courier New',fontSize:sz+'px',fontStyle:it?'bold italic':'bold',color:col,stroke:'#000',strokeThickness:3}).setOrigin(.5).setDepth(3);LB.push({o,x,y,k});return o};
lab(X(46),Y(0)-14,'EQUATOR 0°',13,'#ffb3b3','a');lab(X(0)+60,Y(37),'PRIME MERIDIAN 0°',13,'#fff3a0','a');
R.forEach(q=>{g.fillStyle(0x5aa534,1).lineStyle(2,0x2f5d1b,1);q.r.forEach(r=>{g.beginPath();r.forEach(([x,y],i)=>i?g.lineTo(x*K,y*K):g.moveTo(x*K,y*K));g.closePath();g.fillPath();g.strokePath()})});
P.forEach(c=>{const d=D[c.n],x=X(d[0]),y=Y(d[1]);g.fillStyle(0xffffff,1).fillRect(x-5,y-5,10,10).lineStyle(2,0,1).strokeRect(x-5,y-5,10,10);lab(X(c.ll[0]),Y(c.ll[1]),c.n,c.b[2]-c.b[0]<4?10:14,'#ffffff','c:'+c.n);lab(x,y+13,'★ '+c.c,10,'#ffe27a','p:'+c.n)});
CT.forEach(c=>{const x=X(c[1]),y=Y(c[2]);g.fillStyle(0xff9800,1).fillCircle(x,y,6).lineStyle(2,0,1).strokeCircle(x,y,6);lab(x,y+13,c[0],10,'#ffcc80','x')});
OC.forEach(o=>lab(X(o[1]),Y(o[2]),o[0],o[3],'#bfe3ff','x',1));
MS.forEach((d,i)=>{if(S.adv.m.includes(i))return;const x=X(d[1]),y=Y(d[2]),s=this.add.rectangle(x,y,30,30,0xffd23f).setStrokeStyle(4,0).setDepth(6),t=this.add.text(x,y,'?',{fontFamily:'Courier New',fontSize:'22px',fontStyle:'bold',color:'#000'}).setOrigin(.5).setDepth(7);this.tweens.add({targets:[s,t],scale:1.25,yoyo:true,repeat:-1,duration:600});marks.push({d,x,y,s,t,i})});
pl0=this.pl=this.add.rectangle(X(-3),Y(5),22,22,0x2255ff).setStrokeStyle(3,0xffffff).setDepth(8);
this.cameras.main.setBounds(0,0,712*K,640*K).startFollow(this.pl,true,.12,.12).setZoom(Math.max(.9,Math.min(innerWidth,innerHeight)/520));
this.k=this.input.keyboard.addKeys('W,A,S,D,UP,DOWN,LEFT,RIGHT');this.input.on('pointerdown',e=>{if(!busy)tgt={x:e.worldX,y:e.worldY}});this.ar=this.add.text(0,0,'➤',{fontSize:'34px',color:'#ffeb3b',stroke:'#000',strokeThickness:5}).setOrigin(.5).setDepth(9);intro()}
function update(t,dt){const p=this.pl,k=this.k;
const vx=dir.x+((k.D.isDown||k.RIGHT.isDown)?1:0)-((k.A.isDown||k.LEFT.isDown)?1:0),vy=dir.y+((k.S.isDown||k.DOWN.isDown)?1:0)-((k.W.isDown||k.UP.isDown)?1:0);
let mx=vx,my=vy;if(vx||vy)tgt=null;else if(tgt){const dx=tgt.x-p.x,dy=tgt.y-p.y;if(Math.hypot(dx,dy)<8)tgt=null;else{mx=dx;my=dy}}
if(!busy&&(mx||my)){const l=Math.hypot(mx,my),sp=(here?170:260)*dt/1000;p.x=Phaser.Math.Clamp(p.x+mx/l*sp,0,712*K);p.y=Phaser.Math.Clamp(p.y+my/l*sp,0,640*K)}
this.n=(this.n||0)+1;
if(this.n%6===0){here=where(p.x,p.y);if(here&&!disc.has(here.n)){disc.add(here.n);S.adv.d=[...disc];save();toast(`🆕 <b>${here.n}</b> discovered! Capital: ${here.c} · ${kind(here)} · ${hemi(here)}<br>Borders: ${here.nb.join(', ')||'none (island)'}<br>💡 ${D[here.n][2]}`)}
LB.forEach(l=>{if(l.k[1]===':'){if(l.k[0]==='p'){const d=D[l.k.slice(2)];if(Math.hypot(X(d[0])-p.x,Y(d[1])-p.y)<90)l.s=1}else if(disc.has(l.k.slice(2)))l.s=1}else if(Math.hypot(l.x-p.x,l.y-p.y)<(l.k==='a'?9e9:260))l.s=1;l.o.setVisible(study||!!l.s)})}
const lo=LON(p.x),la=LAT(p.y);let near=null,nd=1e9;marks.forEach(m=>{const d=Math.hypot(m.x-p.x,m.y-p.y);if(d<nd){nd=d;near=m}});
if(near){const a=Math.atan2(near.y-p.y,near.x-p.x);this.ar.setVisible(nd>90&&!busy).setPosition(p.x+Math.cos(a)*50,p.y+Math.sin(a)*50).setRotation(a)}else this.ar.setVisible(false);
hud.innerHTML=`📍 ${here?here.n+' · ★ '+here.c+' · '+kind(here)+' · '+hemi(here):'at sea 🌊'}<br>🧭 ${fmt(la,'N','S')} ${fmt(lo,'E','W')} · 💎${tot()} · ❤️${Math.max(hp,0)} · 🗺️ ${got}/${MS.length}${near?` · next: ${fmt(LAT(near.y),'N','S')} ${fmt(LON(near.x),'E','W')}`:''}`;
if(!busy&&near&&nd<30&&performance.now()>until)mis(near)}
let game=null;
function launch(){if(!game)game=new Phaser.Game({type:Phaser.AUTO,parent:'adv',scale:{mode:Phaser.Scale.RESIZE,width:innerWidth,height:innerHeight},backgroundColor:'#3b79c9',scene:{create,update}});else{if(box.style.display!=='block')busy=false;dispatchEvent(new Event('resize'))}}
function exit(){busy=true;box.style.display='none';toMain()}
function respawn(){hp=6;if(pl0){pl0.x=X(-3);pl0.y=Y(5)}cont()}
window.AD={go,tg,jr,qn,an,cont,exit,respawn,launch};

})();</script>
<script>toMain();</script>
